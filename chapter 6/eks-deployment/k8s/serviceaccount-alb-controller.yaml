# Used only by deploy-cfn.sh, ahead of `helm upgrade --install
# aws-load-balancer-controller ... --set serviceAccount.create=false`.
# deploy.sh (the eksctl path) creates this same object itself via
# `eksctl create iamserviceaccount`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: ${ALB_CONTROLLER_ROLE_ARN}
