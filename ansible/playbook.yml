---
- name: Provision local dev environment
  hosts: localhost
  connection: local
  become: true
  vars:
    aws_cli_arch: "{{ 'aarch64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"
    sam_cli_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"
    k8s_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    kubectl_version: "v1.31.0"
    helm_version: "3.16.2"
  tasks:
    # chapter 6/lambda-deployment: builds the Lambda container image locally
    - name: Check for existing Docker installation
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Install Docker
      ansible.builtin.package:
        name: docker.io
        state: present
      when: docker_check.rc != 0

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: docker_check.rc != 0
      ignore_errors: true

    # chapter 6/lambda-deployment: needed to extract the AWS CLI / SAM CLI installers
    - name: Install unzip
      ansible.builtin.package:
        name: unzip
        state: present

    # dev environment: terminal multiplexer for long-running/background sessions
    - name: Install tmux
      ansible.builtin.package:
        name: tmux
        state: present

    # chapter 6/lambda-deployment: deploy.sh calls `aws sts get-caller-identity`
    - name: Check for existing AWS CLI installation
      ansible.builtin.command: aws --version
      register: aws_cli_check
      failed_when: false
      changed_when: false

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ aws_cli_arch }}.zip"
        dest: /tmp/awscliv2.zip
        mode: "0644"
      when: aws_cli_check.rc != 0

    - name: Unzip AWS CLI installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: aws_cli_check.rc != 0

    - name: Run AWS CLI installer
      ansible.builtin.command: /tmp/aws/install
      when: aws_cli_check.rc != 0

    # chapter 6/lambda-deployment: deploy.sh calls `sam build` / `sam deploy`
    - name: Check for existing AWS SAM CLI installation
      ansible.builtin.command: sam --version
      register: sam_cli_check
      failed_when: false
      changed_when: false

    - name: Download AWS SAM CLI installer
      ansible.builtin.get_url:
        url: "https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-{{ sam_cli_arch }}.zip"
        dest: /tmp/aws-sam-cli.zip
        mode: "0644"
      when: sam_cli_check.rc != 0

    - name: Create AWS SAM CLI install directory
      ansible.builtin.file:
        path: /tmp/sam-installation
        state: directory
        mode: "0755"
      when: sam_cli_check.rc != 0

    - name: Unzip AWS SAM CLI installer
      ansible.builtin.unarchive:
        src: /tmp/aws-sam-cli.zip
        dest: /tmp/sam-installation
        remote_src: true
      when: sam_cli_check.rc != 0

    - name: Run AWS SAM CLI installer
      ansible.builtin.command: /tmp/sam-installation/install
      when: sam_cli_check.rc != 0

    # chapter 6/eks-deployment: deploy.sh and deploy-cfn.sh both call kubectl
    # directly (apply manifests, check rollout/ingress status)
    - name: Check for existing kubectl installation
      ansible.builtin.command: kubectl version --client
      register: kubectl_check
      failed_when: false
      changed_when: false

    - name: Download kubectl {{ kubectl_version }}
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ k8s_arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      when: kubectl_check.rc != 0

    # chapter 6/eks-deployment: both scripts install the AWS Load Balancer
    # Controller with `helm upgrade --install`
    - name: Check for existing Helm installation
      ansible.builtin.command: helm version
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Download Helm {{ helm_version }}
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ k8s_arch }}.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: "0644"
      when: helm_check.rc != 0

    - name: Unarchive Helm
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true
      when: helm_check.rc != 0

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ k8s_arch }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
      when: helm_check.rc != 0

    # chapter 6/eks-deployment: both scripts template the k8s/ manifests with
    # envsubst before `kubectl apply`
    - name: Install gettext-base (provides envsubst)
      ansible.builtin.package:
        name: gettext-base
        state: present
